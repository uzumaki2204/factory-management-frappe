[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factory_management"
version = "0.1.25"
description = "Shared factory devices and QC tablet APIs for Frappe"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["factory_management*"]

[tool.bench.frappe-dependencies]
frappe = ">=16.53.0,<17.0.0"

[tool.setuptools.package-data]
factory_management = [
    "*.txt",
    "*.json",
    "doctype_metadata/*.json",
    "www/*.html",
    "www/*.py",
    "www/*.js",
    "server_scripts/*.py",
    "public/*.json",
    "public/js/*.js",
    "public/js/*.json",
    "public/css/*.css",
    "public/images/*",
    "public/vendor/swagger-ui/*",
    "web_pages/*.html",
    "templates/*.html",
    "templates/includes/*.html",
    "translations/*.csv",
    "api_management/page/qc_api_docs/*.js",
    "api_management/page/qc_api_docs/*.json",
    "uqqc/*.html",
    "uqqc/server_scripts/*.py",
    "public/uqqc/*",
]

